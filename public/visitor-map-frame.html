<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visitor globe</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0a0a0a;
        font-family: system-ui, sans-serif;
      }

      body.dark {
        color: #e2e8f0;
      }

      [data-fp-globe] {
        max-width: 100%;
        color: inherit !important;
      }

      canvas {
        max-width: 100%;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <script>
      const theme = new URLSearchParams(location.search).get("theme");
      const dark = theme === "dark";
      document.body.classList.toggle("dark", dark);

      const script = document.createElement("script");
      script.async = true;
      script.src =
        "https://feed-pulse.com/api/embed/visitor-globe.js?site_id=f9c18aeb-0402-497d-9ae5-7b826837021c&map=globe&sz=md&theme=" +
        (dark ? "indigo" : "ivory") +
        "&speed=normal";
      script.onerror = () => {
        document.body.textContent = "The visitor map is unavailable right now.";
      };
      document.body.append(script);
    </script>
  </body>
</html>
