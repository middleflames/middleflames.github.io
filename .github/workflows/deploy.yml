name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git worktree add -B gh-pages /tmp/gh-pages origin/gh-pages
          rsync -a --delete --exclude .git dist/ /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll

          git -C /tmp/gh-pages add -A
          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi

          git -C /tmp/gh-pages commit -m "Deploy ${GITHUB_SHA}"
          git -C /tmp/gh-pages push origin HEAD:gh-pages
